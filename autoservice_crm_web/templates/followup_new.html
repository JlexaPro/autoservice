{% extends 'base.html' %}
{% block content %}
<h1>Новое напоминание</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="form-grid">
  <label>Клиент* <input name="client_id" list="clients-list" placeholder="ID|ФИО|Телефон" required></label>
  <datalist id="clients-list">{% for c in clients %}<option value="{{ c.client_id }}|{{ c.full_name }}|{{ c.phone_raw|phone_ru }}"></option>{% endfor %}</datalist>
  <label>Авто <select name="car_id"><option value="">Не выбрано</option>{% for car in cars %}<option value="{{ car.car_id }}">{{ car.brand }} {{ car.model }} {{ car.plate_number }}</option>{% endfor %}</select></label>
  <label>Тип задачи* <select name="task_type"><option value="Первичный контакт">Первичный контакт</option><option value="Перезвонить">Перезвонить</option><option value="Напомнить о ТО">Напомнить о ТО</option><option value="Сезонное предложение">Сезонное предложение</option><option value="Контроль после ремонта">Контроль после ремонта</option></select></label>
  <label>Дата* <input type="date" name="due_date" value="{{ today }}" required></label>
  <label>Заголовок* <input name="title" required></label>
  <label>Описание <textarea name="description"></textarea></label>
  <label>Удобное время связи <input name="preferred_contact_slot"></label>
  <button class="btn">Сохранить</button>
</form>
{% endblock %}
